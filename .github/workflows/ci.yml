name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-links:
    name: Docs links
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate relative Markdown links
        shell: powershell
        run: powershell.exe -NoProfile -File .\tests\docs\Test-MarkdownLinks.ps1

  adaptive-runtime-checks:
    name: Adaptive runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'
      - name: Exercise optional runtime in temporary workspaces
        run: python -m unittest discover -s tests/adaptive -p "test_*.py" -v

  mods:
    name: Mods (validate + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and mods
        run: |
          claude plugin validate .
          claude plugin validate mods/board
          claude plugin validate mods/idle-guard
      - name: Test mods
        run: |
          claude plugin test mods/board
          claude plugin test mods/idle-guard
